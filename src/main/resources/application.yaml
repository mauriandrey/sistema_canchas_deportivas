spring:
  application:
    name: sistema_canchas_deportivas
  autoconfigure:
    # La autenticación usa UsuarioDetailsService; no se genera un usuario en memoria.
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  profiles:
    default: mysql
    group:
      local:
        - mysql
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      # Las cantidades, existencias, duraciones e IDs deben recibirse como enteros.
      accept-float-as-int: false
    datatype:
      enum:
        # Jackson 3: los enumerados se reciben por nombre, nunca por posición.
        fail-on-numbers-for-enums: true
  jpa:
    hibernate:
      # Fuera de local, el esquema debe gestionarse con migraciones controladas.
      ddl-auto: validate
    open-in-view: false
    show-sql: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

jwt:
  secret: ${JWT_SECRET:ssiTiLlrd2gX8y5a2nPxMUcVvRBElagcZ1mlwOEr113jWnnJc96rQP1i9ReZPBVB}
  expiration: ${JWT_EXPIRATION:3600000}
  issuer: ${JWT_ISSUER:sistema_canchas_deportivas}

app:
  catalogos:
    inicializar: ${APP_INITIALIZE_CATALOGS:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  timezone: ${APP_TIMEZONE:America/Guayaquil}
  admin:
    initial-password: ${ADMIN_INITIAL_PASSWORD:admin123}

